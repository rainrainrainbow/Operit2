name: Deploy Web Experience

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTFLAGS: -Awarnings
      RUST_TOOLCHAIN_VERSION: 1.95.0
      FVM_VERSION: 4.3.0
      WASM_BINDGEN_VERSION: 0.2.122

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bootstrap Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm shim
        run: |
          corepack enable pnpm
          corepack prepare pnpm@10.7.0 --activate
          echo "/opt/hostedtoolcache/node/$(node -v | sed 's/^v//')/x64/bin" >> "$GITHUB_PATH"
          pnpm --version

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare Web build hook dependencies
        run: |
          python -m venv .venv
          npm install --prefix .ci-tools/typescript --no-audit --no-fund typescript@5.9.3

      - name: Install built-in workflow plugin dependencies
        working-directory: plugins/packages/buildin/workflow
        run: corepack pnpm install --frozen-lockfile

      - name: Install FVM
        run: |
          dart pub global activate fvm "$FVM_VERSION"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Install project Flutter SDK
        working-directory: apps/flutter/app
        run: fvm install --skip-pub-get

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version "${WASM_BINDGEN_VERSION}" --locked

      - name: Generate Dart proxy artifacts
        run: cargo check --manifest-path core/crates/proxy/local/Cargo.toml --quiet

      - name: Build Flutter Web experience
        working-directory: apps/flutter/app
        run: fvm flutter build web --release --no-wasm-dry-run --base-href /Operit2/ --no-web-resources-cdn --no-tree-shake-icons

      - name: Force-bundle custom fonts into web output
        working-directory: apps/flutter/app
        run: |
          mkdir -p build/web/assets/fonts
          cp -v assets/fonts/NotoSansSC.ttf build/web/assets/fonts/
          cp -v assets/fonts/CascadiaMono.ttf build/web/assets/fonts/
          ls -la build/web/assets/fonts/

      - name: Force-bundle cross-origin isolation service worker
        working-directory: apps/flutter/app
        run: |
          cp -v web/sw.js build/web/sw.js
          test -s build/web/sw.js

      - name: Verify Flutter Web output
        run: |
          test -s apps/flutter/app/build/web/index.html
          test -s apps/flutter/app/build/web/main.dart.js
          test -s apps/flutter/app/build/web/sw.js
          grep -q "serviceWorker" apps/flutter/app/build/web/index.html

      - name: Configure Web custom domain
        run: rm -f apps/flutter/app/build/web/CNAME

      - name: Publish to gh-pages branch
        run: |
          staging_dir="$RUNNER_TEMP/operit-gh-pages"
          rm -rf "$staging_dir"
          mkdir -p "$staging_dir"
          cp -a apps/flutter/app/build/web/. "$staging_dir/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan gh-pages-tmp
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a "$staging_dir/." .
          git add --all
          git commit -m "deploy: $GITHUB_SHA"
          git push origin HEAD:gh-pages --force
